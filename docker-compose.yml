services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "80:4000"
    environment:
      - NODE_ENV=production
      # PUERTO UNIFICADO: Express corre en 4000 (interno); 80 se expone al host.
      - PORT=4000
      # Piston corre en la misma red Docker, alcanzable por servicio.
      - PISTON_URL=http://piston_api:2000
      # Orígenes CORS permitidos (mismo-origin al servir dist/ desde Express).
      - CORS_ORIGINS=http://localhost,http://localhost:80
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      piston_api:
        condition: service_started

  piston_api:
    image: ghcr.io/engineer-man/piston:latest
    # [B-B-005] Puerto 2000 cerrado al host; comunicación solo en red interna de Docker.
    volumes:
      - piston_packages:/piston/packages
    restart: always

volumes:
  piston_packages: